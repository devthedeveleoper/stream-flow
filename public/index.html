<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow — Premium Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Abstract Background -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <header class="header glass-panel">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00F5D4" />
                        <stop offset="100%" stop-color="#7B2CBF" />
                    </linearGradient>
                </defs>
                <path d="M5 3l14 9-14 9V3z"/>
            </svg>
            StreamFlow
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Library</a>
            <a href="#">Explore</a>
        </nav>
        <span class="badge">Cloudflare Edge</span>
    </header>

    <main class="main">
        <!-- Input Section -->
        <div class="container glass-panel" id="urlSection">
            <h1>Stream <span class="text-gradient">Without Limits</span></h1>
            <p class="subtitle">Enter any video URL for instant high-performance playback.</p>
            
            <div class="input-glow-wrapper">
                <div class="input-wrapper">
                    <input type="url" id="videoUrl" placeholder="Paste video URL here..." autocomplete="off" spellcheck="false">
                    <button class="btn primary-btn" id="loadBtn">
                        Stream Now
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="proxy-option">
                <label class="proxy-toggle">
                    <input type="checkbox" id="useProxy" checked>
                    <span class="proxy-slider"></span>
                </label>
                <span class="proxy-label">Proxy via Cloudflare Edge (Bypasses CORS)</span>
            </div>

            <div class="history-section" id="historySection" style="display: none;">
                <h3 class="history-title">Continue Watching</h3>
                <div class="history-list" id="historyList">
                    <!-- History items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Player Section -->
        <div class="player-wrapper glass-panel" id="playerSection">
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" preload="auto" playsinline></video>
                <div class="video-overlay" id="videoOverlay">
                    <div class="loader" id="videoLoader"></div>
                </div>
            
                <div class="custom-controls">
                    <!-- Progress Bar -->
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bg"></div>
                        <div class="progress-played" id="progressPlayed">
                            <div class="progress-thumb" id="progressThumb"></div>
                        </div>
                    </div>
                    
                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="playBtn" title="Play/Pause" aria-label="Play or Pause">
                                <svg viewBox="0 0 24 24">
                                    <polygon id="playIcon" points="5 3 19 12 5 21 5 3" fill="currentColor"/>
                                    <g id="pauseIcon" style="display:none;">
                                        <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                                        <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
                                    </g>
                                </svg>
                            </button>
                            
                            <button class="ctrl-btn" id="skipBackBtn" title="Back 10s" aria-label="Skip Back 10 Seconds">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <path d="M13 5l-6 6 6 6"/>
                                    <path d="M19 5l-6 6 6 6"/>
                                </svg>
                            </button>
                            
                            <button class="ctrl-btn" id="skipForwardBtn" title="Forward 10s" aria-label="Skip Forward 10 Seconds">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <path d="M11 5l6 6-6 6"/>
                                    <path d="M5 5l6 6-6 6"/>
                                </svg>
                            </button>
                            
                            <div class="volume-control">
                                <button class="ctrl-btn" id="muteBtn" title="Mute" aria-label="Mute or Unmute">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    </svg>
                                </button>
                                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" aria-label="Volume Slider">
                            </div>
                            
                            <span class="time-display">
                                <span id="currentTime">00:00</span> <span class="time-separator">/</span> <span id="duration">00:00</span>
                            </span>
                        </div>

                        <div class="controls-right">
                            <select class="speed-select" id="speedSelect" aria-label="Playback Speed">
                                <option value="0.5">0.5x</option>
                                <option value="1" selected>1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2">2.0x</option>
                            </select>
                            
                            <button class="ctrl-btn" id="pipBtn" title="Picture-in-Picture" aria-label="Picture in Picture">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <rect x="12" y="11" width="7" height="6" rx="1"></rect>
                                </svg>
                            </button>

                            <button class="ctrl-btn" id="theaterBtn" title="Theater Mode" aria-label="Theater Mode">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                                </svg>
                            </button>
                            
                            <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle Fullscreen">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="back-btn glass-panel" id="backBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                New Video
            </button>
        </div>
        
        <!-- Toaster for notifications -->
        <div id="toast" class="toast hidden"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="script.js"></script>
</body>
</html>
